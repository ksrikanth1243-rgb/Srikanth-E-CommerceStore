server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/(auth|users)(/|$) {
        set $svc http://user-service:3001;
        proxy_pass $svc;
    }
    location ~ ^/api/(products|categories)(/|$) {
        set $svc http://product-service:3002;
        proxy_pass $svc;
    }
    location ~ ^/api/cart(/|$) {
        set $svc http://cart-service:3003;
        proxy_pass $svc;
    }
    location ~ ^/api/(orders|payments)(/|$) {
        set $svc http://order-service:3004;
        proxy_pass $svc;
    }

    location = /health/user {
        set $svc http://user-service:3001;
        rewrite ^ /health break;
        proxy_pass $svc;
    }
    location = /health/products {
        set $svc http://product-service:3002;
        rewrite ^ /health break;
        proxy_pass $svc;
    }
    location = /health/cart {
        set $svc http://cart-service:3003;
        rewrite ^ /health break;
        proxy_pass $svc;
    }
    location = /health/orders {
        set $svc http://order-service:3004;
        rewrite ^ /health break;
        proxy_pass $svc;
    }
}
